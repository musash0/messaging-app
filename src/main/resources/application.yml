server:
  port: 8080

spring:
  application:
    name: sporty-messaging-app

  datasource:
    url: jdbc:h2:mem:bets;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: sporty-messaging
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.sporty.domain.EventOutcome

rocketmq:
  name-server: localhost:9876
  producer:
    group: bet-settlement-producer
    send-message-timeout: 5000

app:
  topics:
    event-outcomes: event-outcomes
    bet-settlements: bet-settlements

logging:
  level:
    org.example: INFO
    org.apache.rocketmq: WARN
    org.apache.kafka: WARN